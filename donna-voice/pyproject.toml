[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donna-voice"
version = "0.1.0"
description = "LiveKit voice agent for Donna — Twilio + Sonnet 4 + Cartesia."
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.5.0",
    "livekit-plugins-deepgram>=1.5.0",
    "livekit-plugins-cartesia>=1.5.0",
    "livekit-plugins-openai>=1.5.0",
    "livekit-plugins-silero>=1.5.0",
    "livekit-plugins-turn-detector>=1.5.0",
    "livekit-api>=1.1.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

# Map the underscore Python package name to the hyphenated repo dir.
# This is what makes `python -m donna_voice.agent` work when launching
# from the donna-voice/ directory after `pip install -e .`.
[tool.setuptools]
packages = ["donna_voice"]

[tool.setuptools.package-dir]
donna_voice = "."

[tool.setuptools.package-data]
donna_voice = ["trunks/*.json", "scripts/*.sh", ".env.example"]
